services:
  db:
    image: postgres:16
    container_name: zeo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeo
      POSTGRES_PASSWORD: zeo
      POSTGRES_DB: zeo_find_work
    ports:
      - "5433:5432"
    volumes:
      - zeo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeo -d zeo_find_work"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zeo_pgdata:
